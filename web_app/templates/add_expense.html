{% extends "base.html" %}
{% block content %}
<div class="expense-form">
    <h1>{% if edit_mode %}Edit Expense{% else %}Add Expense{% endif %}</h1>
    <form method="POST" action="{% if edit_mode %}/edit/{{ expense_id }}{% else %}/add{% endif %}">
        <label for="amount">Amount</label>
        <input type="number" id="amount" name="amount" step="0.01" min="0.01"
               value="{{ form_data.get('amount', '') }}" required>

        <label for="category">Category</label>
        <select id="category" name="category" required>
            <option value="">-- Select --</option>
            {% for cat in categories %}
            <option value="{{ cat }}" {% if form_data.get('category') == cat %}selected{% endif %}>{{ cat }}</option>
            {% endfor %}
        </select>

        <label for="date">Date</label>
        <input type="date" id="date" name="date"
               value="{{ form_data.get('date', '') }}" required>

        <label for="note">Note</label>
        <textarea id="note" name="note" rows="2">{{ form_data.get('note', '') }}</textarea>

        <button type="submit">{% if edit_mode %}Update Expense{% else %}Add Expense{% endif %}</button>
    </form>
    <a href="/" class="back-link">Back to Dashboard</a>
</div>
{% endblock %}
